# Solo para DESARROLLO: levanta PostgreSQL 18 en el portátil.
# En producción se usa el PostgreSQL nativo del Windows Server.
# Lee las variables del fichero .env de esta misma carpeta.

# Nombre de proyecto explícito: evita que Compose lo deduzca de la carpeta
# y lo mezcle con contenedores/volúmenes de otros proyectos.
name: control-formacion

services:
  db:
    image: postgres:18
    container_name: control_formacion_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Puerto del portátil (DB_PORT, 5433) -> puerto interno del contenedor (5432).
      # Así no choca con el PostgreSQL del otro proyecto en el 5432.
      - "${DB_PORT}:5432"
    volumes:
      # Ojo: desde PostgreSQL 18 la imagen oficial espera el volumen en
      # /var/lib/postgresql (ya NO en /var/lib/postgresql/data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: